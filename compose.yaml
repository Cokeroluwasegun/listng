services:
  postgres:
    image: postgres:16-alpine
    container_name: listng_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: listng
      POSTGRES_PASSWORD: listng_local
      POSTGRES_DB: listng_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listng"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: listng_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local mail testing (catches all outgoing mail)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: listng_mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
